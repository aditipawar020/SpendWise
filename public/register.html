<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - SpendWise</title>

    <link rel="stylesheet" href="css/auth.css">
</head>

<body>

    <div class="auth-container">

        <!-- Left Side -->
        <div class="auth-info">

            <div class="brand">
                SpendWise
            </div>

            <div class="info-content">

                <p class="small-title">
                    SMART MONEY MANAGEMENT
                </p>

                <h1>
                    Start managing<br>
                    your money smarter.
                </h1>

                <p>
                    Create your SpendWise account and take control
                    of your income, expenses, budgets and savings.
                </p>

            </div>

        </div>


        <!-- Registration Form -->
        <div class="auth-form-container">

            <div class="auth-form">

                <a href="/" class="back-home">
                    ← Back to Home
                </a>

                <h2>Create Account</h2>

                <p class="form-description">
                    Create your SpendWise account to get started.
                </p>


                <form id="registerForm">

                    <div class="form-group">

                        <label for="name">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Enter your full name"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Create a password"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="confirmPassword">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Confirm your password"
                            required
                        >

                    </div>


                    <div id="registerMessage"></div>


                    <button type="submit" class="auth-button">
                        Create Account
                    </button>

                </form>


                <p class="account-text">
                    Already have an account?
                    <a href="/login.html">Login</a>
                </p>

            </div>

        </div>

    </div>


    <script src="js/register.js"></script>

</body>
</html>
