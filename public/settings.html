<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Settings - SpendWise</title>

    <link rel="stylesheet" href="css/settings.css">

</head>

<body>


    <!-- ===============================
         SIDEBAR
         =============================== -->

    <aside class="sidebar">

        <div class="logo">
            SpendWise
        </div>


        <nav>

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="transactions.html">
                Transactions
            </a>

            <a href="budget.html">
                Budget
            </a>

            <a href="savings.html">
                Savings Goals
            </a>

            <a href="reports.html">
                Reports
            </a>

            <a href="settings.html" class="active">
                Settings
            </a>

        </nav>


        <button id="logoutBtn" class="logout-btn">
            Logout
        </button>

    </aside>



    <!-- ===============================
         MAIN CONTENT
         =============================== -->

    <main class="main-content">


        <div class="page-header">

            <div class="small-title">
                SPENDWISE SETTINGS
            </div>

            <h1>Settings</h1>

            <p class="description">
                Manage your profile and account settings.
            </p>

        </div>



        <!-- ===============================
             PROFILE SETTINGS
             =============================== -->

        <section class="settings-card">

            <h2>Profile Information</h2>

            <form id="profileForm">


                <div class="form-row">


                    <div class="form-group">

                        <label for="profileName">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="profileName"
                            placeholder="Enter your name"
                            required
                        >

                    </div>



                    <div class="form-group">

                        <label for="profileEmail">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="profileEmail"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                </div>



                <div class="form-row">


                    <div class="form-group">

                        <label for="profileUserType">
                            User Type
                        </label>

                        <select id="profileUserType">

                            <option value="Student">
                                Student
                            </option>

                            <option value="Salaried">
                                Salaried
                            </option>

                            <option value="Business">
                                Business
                            </option>

                            <option value="Personal">
                                Personal
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label>
                            Account Status
                        </label>

                        <input
                            type="text"
                            id="profileStatus"
                            value="Approved"
                            readonly
                        >

                    </div>


                </div>



                <button
                    type="submit"
                    class="save-btn">

                    Save Profile

                </button>


                <p
                    id="profileMessage"
                    class="message">
                </p>


            </form>

        </section>



        <!-- ===============================
             CHANGE PASSWORD
             =============================== -->

        <section class="settings-card">

            <h2>Change Password</h2>

            <form id="passwordForm">


                <div class="form-row">


                    <div class="form-group">

                        <label for="currentPassword">
                            Current Password
                        </label>

                        <input
                            type="password"
                            id="currentPassword"
                            placeholder="Enter current password"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="newPassword">
                            New Password
                        </label>

                        <input
                            type="password"
                            id="newPassword"
                            placeholder="Enter new password"
                            minlength="6"
                            required
                        >

                    </div>


                </div>



                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm New Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm new password"
                        minlength="6"
                        required
                    >

                </div>



                <button
                    type="submit"
                    class="save-btn">

                    Change Password

                </button>


                <p
                    id="passwordMessage"
                    class="message">
                </p>


            </form>

        </section>



        <!-- ===============================
             ACCOUNT INFORMATION
             =============================== -->

        <section class="settings-card">


            <h2>Account Information</h2>


            <div class="account-info">


                <div>

                    <span>
                        Account Type
                    </span>

                    <strong id="accountType">
                        -
                    </strong>

                </div>


                <div>

                    <span>
                        Member Since
                    </span>

                    <strong id="memberSince">
                        -
                    </strong>

                </div>


            </div>


        </section>


    </main>



    <!-- ===============================
         SCRIPTS
         =============================== -->

    <script src="js/auth.js"></script>

    <script src="js/settings.js"></script>

</body>

</html>
