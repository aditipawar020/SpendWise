<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - SpendWise</title>

    <link rel="stylesheet" href="css/login.css">

</head>

<body>

    <div class="auth-container">

        <!-- Left Side -->
        <div class="auth-info">

            <div class="brand">
                SpendWise
            </div>

            <div class="info-content">

                <p class="small-title">
                    WELCOME BACK
                </p>

                <h1>
                    Your money.<br>
                    Your control.
                </h1>

                <p>
                    Login to SpendWise and continue tracking your
                    expenses, managing your budget and reaching
                    your savings goals.
                </p>

            </div>

        </div>


        <!-- Login Form -->
        <div class="auth-form-container">

            <div class="auth-form">

                <a href="/" class="back-home">
                    ← Back to Home
                </a>

                <h2>Welcome Back</h2>

                <p class="form-description">
                    Login to your SpendWise account.
                </p>


                <form id="loginForm">

                    <div class="form-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            required
                        >

                    </div>


                    <div id="loginMessage"></div>


                    <button type="submit" class="auth-button">
                        Login
                    </button>

                </form>


                <p class="account-text">
                    Don't have an account?
                    <a href="/register.html">Create Account</a>
                </p>

            </div>

        </div>

    </div>


    <script src="js/login.js"></script>

</body>
</html>
