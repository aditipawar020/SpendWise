<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SpendWise - Savings Goals</title>

    <link rel="stylesheet"
          href="css/savings.css">

</head>

<body>

    <!-- ===============================
         SIDEBAR
         =============================== -->

    <aside class="sidebar">

        <div class="logo">
            SpendWise
        </div>

        <nav>

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="transactions.html">
                Transactions
            </a>

            <a href="budget.html">
                Budget
            </a>

            <a href="savings.html"
               class="active">
                Savings Goals
            </a>

            <a href="reports.html">
                Reports
            </a>

            <a href="settings.html">
                Settings
            </a>

        </nav>

        <button id="logoutBtn"
                class="logout-btn">
            Logout
        </button>

    </aside>


    <!-- ===============================
         MAIN CONTENT
         =============================== -->

    <main class="main-content">

        <header class="page-header">

            <h1>Savings Goals</h1>

            <p>
            Set and manage your financial goals
            </p>

        </header>


        <!-- ===============================
             ADD GOAL
             =============================== -->

        <section class="goal-form-card">

            <h2>
                Create New Savings Goal
            </h2>

            <form id="savingsGoalForm">

                <div class="form-group">

                    <label for="goalName">
                        Goal Name
                    </label>

                    <input
                        type="text"
                        id="goalName"
                        placeholder="e.g. New Laptop"
                        required>

                </div>


                <div class="form-group">

                    <label for="targetAmount">
                        Target Amount (₹)
                    </label>

                    <input
                        type="number"
                        id="targetAmount"
                        placeholder="e.g. 50000"
                        min="1"
                        step="0.01"
                        required>

                </div>


                <div class="form-group">

                    <label for="targetDate">
                        Target Date
                    </label>

                    <input
                        type="date"
                        id="targetDate">

                </div>


                <button
                    type="submit"
                    class="submit-btn">

                    Add Savings Goal

                </button>

            </form>

            <p id="goalMessage"
               class="goal-message">
            </p>

        </section>


        <!-- ===============================
             GOALS LIST
             =============================== -->

        <section class="goals-card">

            <div class="card-header">

                <h2>
                    My Savings Goals
                </h2>

                <button
                    id="refreshBtn"
                    class="refresh-btn">

                    Refresh

                </button>

            </div>


            <div id="goalsList">

                <p class="empty-message">
                    Loading savings goals...
                </p>

            </div>

        </section>

    </main>


    <!-- LOGIN PROTECTION FIRST -->

    <script src="js/auth.js"></script>

    <!-- SAVINGS PAGE JAVASCRIPT -->

    <script src="js/savings.js"></script>

</body>

</html>
